name: ci

on:
  pull_request:
    branches: [update1, main]
  push:
    branches: [update1, main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wings/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
